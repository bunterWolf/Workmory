name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Builds only. Nothing reaches GitHub Releases until every platform has succeeded.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Must satisfy the "engines" of the Electron version in package.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Runs the tests and compiles; a failure here is real and is not retried
      - name: Build application
        run: npm run build

      # electron-builder downloads its tools from GitHub while packaging, and those
      # downloads fail now and then with a 504. Update files are still generated.
      - name: Package installers
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder --publish never && exit 0
            echo "Packaging attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          if-no-files-found: error
          path: |
            release/*/Workmory-*
            release/*/latest*.yml

  # Single publishing step, so a failed build never leaves a partial release behind.
  # Safe to re-run: existing assets of the same release are replaced.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # upload-artifact keeps the version folder from release/<version>/, so the files
      # are in artifacts/<version>/. A tag that doesn't match package.json finds nothing.
      - name: List artifacts
        run: ls -laR artifacts

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/${{ steps.version.outputs.version }}/Workmory-*
            artifacts/${{ steps.version.outputs.version }}/latest*.yml
